function shopSearch(v){ shopsQuery = v; renderShopBody(); }
function renderShopBody() {
  const body = document.getElementById('shop-body'); if (!body) return;
  const q = shopsQuery.trim().toLowerCase();
  let rows = DB.shops.slice();
  if (q) rows = rows.filter(s => (s.name||'').toLowerCase().includes(q) || (s.phone||'').includes(q) || (s.address||'').toLowerCase().includes(q));
  rows.sort((a,b)=>b.id-a.id);
  const allCount = rows.length;
  const outCount = rows.filter(s => calcShopOutstanding(s) > 0.5).length;
  const clearCount = allCount - outCount;
  const pills = document.getElementById('shop-filters');
  if (pills) pills.innerHTML = `<div class="filter-pill ${shopFilter==='all'?'active':''}" onclick="setShopFilter('all')">All <span class="count">${allCount}</span></div><div class="filter-pill red-pill ${shopFilter==='outstanding'?'active':''}" onclick="setShopFilter('outstanding')">⚠️ Outstanding <span class="count">${outCount}</span></div><div class="filter-pill green-pill ${shopFilter==='clear'?'active':''}" onclick="setShopFilter('clear')">✓ Clear <span class="count">${clearCount}</span></div>`;
  if (shopFilter === 'outstanding') rows = rows.filter(s => calcShopOutstanding(s) > 0.5);
  else if (shopFilter === 'clear') rows = rows.filter(s => calcShopOutstanding(s) <= 0.5);

function addShopPayment(shopId) {
  const s = DB.shops.find(x=>x.id===shopId); if (!s) return;
  const stats = calcShopStats(s);
  if (stats.outstanding <= 0.5) { toast('Shop fully paid','info'); return; }
  const linkedCust = s.customer_id ? DB.customers.find(c=>c.id===s.customer_id) : null;
  openModal(`Add Payment — ${s.name}`, `<div class="form-grid"><div class="danger-box" style="background:rgba(255,159,10,.12);border-color:rgba(255,159,10,.5)"><div class="danger-text" style="color:var(--orange)">Outstanding: <b>${fmtInt(stats.outstanding)}</b></div></div>${field('Amount', `<input id="sp-amt" class="ios-input" type="number" step="0.01" value="${stats.outstanding}" min="0" max="${stats.outstanding}" autofocus>`, true)}${field('Note', '<input id="sp-note" class="ios-input" placeholder="Bank, cash">')}</div>`, () => {
    const amt = Number(document.getElementById('sp-amt').value || 0);
    if (!amt || amt <= 0 || amt > stats.outstanding + 0.01) { toast('Invalid amount','error'); return false; }
    const note = document.getElementById('sp-note').value.trim();
    DB.shop_payments.push({ id: nextId('shop_payments'), shop_id: shopId, customer_id: s.customer_id || null, amount: amt, note, created_at: now(), user_id: currentUser?.id || null });
    if (s.customer_id) { const c = DB.customers.find(x=>x.id===s.customer_id); if (c) { const oldBal = Number(c.balance)||0; c.balance = Math.max(0, oldBal - amt); if (oldBal - c.balance > 0) DB.credit_payments.push({ id: nextId('credit_payments'), customer_id: s.customer_id, amount: oldBal - c.balance, method: 'shop-payment', note: `From shop ${s.name}`, created_at: now(), user_id: currentUser?.id || null }); } }
    save(); toast(`Payment ${fmtInt(amt)} recorded`,'success'); renderShopBody(); setTimeout(()=>showShopDetail(shopId), 300);
  });
}

function recordShopPayment(repairId) {

/* CUSTOMERS */
let custQuery = '';
let custFilter = 'all';
let custSort = 'newest';
function renderCustomers(root) {
  const tc = getTotalCredit();
  const cc = DB.customers.filter(c=>(Number(c.balance)||0) > 0).length;
  const clc = DB.customers.length - cc;
  root.innerHTML = `<div class="view-shell"><div class="page-head"><h1>Customers</h1><button class="ios-pill blue" onclick="showAddCustomer()">+ Add Customer</button></div>${tc > 0 ? `<div class="card" style="border-color:rgba(255,159,10,.5)"><div class="muted small" style="font-weight:700;text-transform:uppercase;letter-spacing:.06em">Total Outstanding Credit</div><div style="font-size:24px;font-weight:800;color:var(--orange);margin-top:4px">${fmtInt(tc)}</div><div class="muted small">${cc} customer${cc!==1?'s':''} owe</div></div>` : ''}<div class="search-row">${searchBar('cust-search','🔍 Search name, phone, id, address...','custSearch(this.value)')}</div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><div class="filter-pills"><div class="filter-pill ${custFilter==='all'?'active':''}" onclick="custSetFilter('all')">All <span class="count">${DB.customers.length}</span></div><div class="filter-pill orange-pill ${custFilter==='outstanding'?'active':''}" onclick="custSetFilter('outstanding')">⚠️ Outstanding <span class="count">${cc}</span></div><div class="filter-pill ${custFilter==='clear'?'active':''}" onclick="custSetFilter('clear')">✓ Clear <span class="count">${clc}</span></div></div><select id="cust-sort" class="ios-input" style="max-width:220px" onchange="custSetSort(this.value)"><option value="newest" ${custSort==='newest'?'selected':''}>Newest</option><option value="balance-high" ${custSort==='balance-high'?'selected':''}>💰 High → Low</option><option value="balance-low" ${custSort==='balance-low'?'selected':''}>💰 Low → High</option><option value="name" ${custSort==='name'?'selected':''}>🔤 A → Z</option></select></div><div class="view-scroll" id="cust-list"></div></div>`;
  if (custQuery) document.getElementById('cust-search').value = custQuery;
  filterCustomers();
}
function custSearch(v){ custQuery = v; filterCustomers(); }
function custSetFilter(f){ custFilter = f; renderCustomers(document.getElementById('content')); }
function custSetSort(s){ custSort = s; filterCustomers(); }
function filterCustomers() {
  const q = custQuery.trim().toLowerCase();
  let rows = DB.customers.slice();
  if (custFilter === 'outstanding') rows = rows.filter(c => (Number(c.balance)||0) > 0);
  else if (custFilter === 'clear') rows = rows.filter(c => (Number(c.balance)||0) <= 0);
  if (q) rows = rows.filter(c => (c.name||'').toLowerCase().includes(q) || (c.phone||'').toLowerCase().includes(q) || (c.email||'').toLowerCase().includes(q) || (c.address||'').toLowerCase().includes(q) || (c.id_number||'').toLowerCase().includes(q));
  switch (custSort) {
    case 'balance-high': rows.sort((a,b)=>(Number(b.balance)||0)-(Number(a.balance)||0)); break;
    case 'balance-low': rows.sort((a,b)=>(Number(a.balance)||0)-(Number(b.balance)||0)); break;
    case 'name': rows.sort((a,b)=>(a.name||'').localeCompare(b.name||'')); break;
    default: rows.sort((a,b)=>b.id-a.id);
  }
  const el = document.getElementById('cust-list'); if (!el) return;
  if (!rows.length){ el.innerHTML = '<div class="card center pad muted">No customers</div>'; return; }
  el.innerHTML = `<div class="ios-table-wrap"><table class="ios-table"><thead><tr><th>#</th><th>Name</th><th>Phone</th><th>Address</th><th>Balance</th><th></th></tr></thead><tbody>${rows.map(c => { const bal = Number(c.balance)||0; return `<tr><td class="muted">${c.id}</td><td class="strong">${esc(c.name)}</td><td>${esc(c.phone||'-')}</td><td class="muted small">${esc((c.address||'-').slice(0,30))}</td><td>${bal > 0 ? `<span class="danger-c strong">${fmtInt(bal)}</span>` : '<span class="success">—</span>'}</td><td style="display:flex;gap:4px;flex-wrap:wrap"><button class="ios-pill sm" onclick="showCustomerDetail(${c.id})">View</button>${bal > 0 ? `<button class="ios-pill orange sm" onclick="recordCreditPayment(${c.id})">Pay</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`;
}

function recordCreditPayment(customerId) {
  const c = DB.customers.find(x=>x.id===customerId); if (!c) return;
  const bal = Number(c.balance)||0;
  if (bal <= 0) { toast('No balance','info'); return; }
  openModal(`Pay Credit — ${c.name}`, `<div class="form-grid"><div class="danger-box" style="background:rgba(255,159,10,.12);border-color:rgba(255,159,10,.5)"><div class="danger-text" style="color:var(--orange)">Owed: <b>${fmt(bal)}</b></div></div>${field('Amount', `<input id="pc-amount" class="ios-input" type="number" step="0.01" value="${bal}" min="0" max="${bal}" autofocus>`, true)}${field('Method', `<select id="pc-method" class="ios-input"><option value="cash">💵 Cash</option><option value="card">💳 Card</option><option value="bank">🏦 Bank</option><option value="qr">📱 QR</option></select>`)}${field('Note', '<input id="pc-note" class="ios-input">')}</div>`, () => {
    const amt = Number(document.getElementById('pc-amount').value||0);
    if (!amt || amt <= 0 || amt > bal + 0.01) { toast('Invalid','error'); return false; }
    DB.credit_payments.push({ id:nextId('credit_payments'), customer_id:customerId, amount:amt, method:document.getElementById('pc-method').value, note:document.getElementById('pc-note').value.trim(), created_at:now(), user_id:currentUser?.id||null });
    c.balance = Math.max(0, bal - amt);
    save(); toast(`Payment ${fmtInt(amt)} recorded`,'success'); render();
  });
}

  const from = document.getElementById('rep-from').value;

  const pRets = DB.returns.filter(r => { const d = r.created_at.slice(0,10); return d >= from && d <= to; });

      <div class="stat"><div class="stat-label">Sales Total</div><div class="stat-value">${fmtInt(total)}</div></div>
      <div class="stat"><div class="stat-label">Received</div><div class="stat-value success">${fmtInt(paid)}</div></div>
      ${cv ? `<div class="stat"><div class="stat-label">Est. Profit</div><div class="stat-value success">${fmtInt(profit)}</div></div>` : ''}
      <div class="stat"><div class="stat-label">New Credit</div><div class="stat-value warn">${fmtInt(creditNew)}</div></div>
      ${retsTotal > 0 ? `<div class="stat" style="border-color:rgba(255,69,58,.5)"><div class="stat-label">Returns</div><div class="stat-value danger-c">${fmtInt(retsTotal)}</div></div>` : ''}
      <div class="stat"><div class="stat-label">Invoices</div><div class="stat-value primary-c">${sales.length}</div></div>
    </div>
    ${sales.length ? `<div class="ios-table-wrap"><table class="ios-table"><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Cashier</th><th>Total</th><th>Paid</th><th>Balance</th><th>Actions</th></tr></thead><tbody>${sales.map(s => { const c = DB.customers.find(x=>x.id===s.customer_id); const u = DB.users.find(x=>x.id===s.user_id); const rt = getSaleReturnTotal(s.id); return `<tr><td class="muted small">${esc(s.invoice_no)}${rt>0?' <span class="danger-c">↩</span>':''}</td><td class="muted small">${esc(s.created_at)}</td><td>${esc(c?.name||'Walk-in')}</td><td class="muted small">${esc(u?.name||'-')}</td><td class="strong">${fmtInt(s.total)}</td><td class="success">${fmtInt(s.paid_amount)}</td><td class="${s.balance>0?'warn':''}">${fmtInt(s.balance)}</td><td style="display:flex;gap:4px;flex-wrap:wrap"><button class="ios-pill sm" onclick="printSaleReceipt(${s.id})">🖨️</button><button class="ios-pill wa sm" onclick="promptWhatsApp(${s.id})">💬</button><button class="ios-pill red sm" onclick="showReturnModal(${s.id})">↩️</button></td></tr>`; }).join('')}</tbody></table></div>` : '<div class="card center pad muted">No invoices</div>'}`;
}
function exportReportCSV() {
  const from = document.getElementById('rep-from').value;
  const to = document.getElementById('rep-to').value;
  const sales = DB.sales.filter(s => { const d = s.created_at.slice(0,10); return d >= from && d <= to; });
  const rows = [['Invoice','Date','Customer','Cashier','Total','Paid','Balance','Method','Returns']];
  sales.forEach(s => { const c = DB.customers.find(x=>x.id===s.customer_id); const u = DB.users.find(x=>x.id===s.user_id); rows.push([s.invoice_no,s.created_at,c?.name||'Walk-in',u?.name||'-',s.total,s.paid_amount,s.balance,s.payment_method,getSaleReturnTotal(s.id)]); });
  const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = `sales_${from}_to_${to}.csv`; a.click();
  toast('CSV exported','success');
}

let billQuery = '';
let billResults = [];
let billSearchType = 'all'; // all | imei | model | customer | invoice | barcode

function renderBillSearch(root) {
  root.innerHTML = `
    <div class="view-shell">
      <div class="page-head"><div><h1>🔎 Bill Search</h1><p>IMEI / Model / Customer / Invoice / Barcode </p></div></div>

          <input id="bill-search-input" placeholder="Type IMEI, model, customer, invoice, barcode..." autocomplete="off" oninput="billSearch(this.value)" autofocus>
          <button class="clear" onclick="billClear()">✕</button>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
          <div class="filter-pill ${billSearchType==='all'?'active':''}" onclick="billSetType('all')">All</div>
          <div class="filter-pill ${billSearchType==='imei'?'active':''}" onclick="billSetType('imei')">📱 IMEI</div>
          <div class="filter-pill ${billSearchType==='model'?'active':''}" onclick="billSetType('model')">📋 Model</div>
          <div class="filter-pill ${billSearchType==='customer'?'active':''}" onclick="billSetType('customer')">👤 Customer</div>
          <div class="filter-pill ${billSearchType==='invoice'?'active':''}" onclick="billSetType('invoice')">🧾 Invoice</div>
          <div class="filter-pill ${billSearchType==='barcode'?'active':''}" onclick="billSetType('barcode')">🏷️ Barcode</div>
        </div>
      </div>
      <div class="view-scroll" id="bill-results">
        <div class="card center pad muted">
          <div style="font-size:40px;margin-bottom:8px">🔎</div>
          <div>Type anything to search bills...</div>
          <div class="small muted" style="margin-top:6px">Total invoices: ${DB.sales.length} · Sold items: ${DB.sale_items.filter(i=>i.item_type!=='reload').length}</div>
        </div>
      </div>
    </div>`;
  setTimeout(() => { const el = document.getElementById('bill-search-input'); if (el && billQuery) { el.value = billQuery; billSearch(billQuery); } else if (el) el.focus(); }, 80);
}
function billSetType(t) { billSearchType = t; renderBillSearch(document.getElementById('content')); }
function billClear() {
  billQuery = '';
  const el = document.getElementById('bill-search-input'); if (el) { el.value = ''; el.focus(); }
  document.getElementById('bill-results').innerHTML = '<div class="card center pad muted"><div style="font-size:40px;margin-bottom:8px">🔎</div><div>Type anything to search bills...</div></div>';
}
function billSearch(v) {
  billQuery = v;
  const q = v.trim().toLowerCase();
  const results = document.getElementById('bill-results');
  if (!results) return;
  if (!q) { billClear(); return; }

  // Find matching sale_items
  const matchedItems = DB.sale_items.filter(it => {
    const itemCode = (it.item_code||'').toLowerCase();
    const desc = (it.description||'').toLowerCase();
    const barcode = (it.barcode||'').toLowerCase();
    if (billSearchType === 'imei') return desc.includes(q) && desc.includes('imei');
    if (billSearchType === 'model') return desc.includes(q) && !desc.includes('imei');
    if (billSearchType === 'barcode') return barcode.includes(q);
    // 'all' or others
    return desc.includes(q) || itemCode.includes(q) || barcode.includes(q);
  });

  // Also match by customer / invoice
  const saleIdsFromItems = new Set(matchedItems.map(it => it.sale_id));
  const allSales = DB.sales;
  const matchedSales = allSales.filter(s => {
    if (billSearchType === 'customer') {
      const c = DB.customers.find(x=>x.id===s.customer_id);
      return (c?.name||'').toLowerCase().includes(q) || (c?.phone||'').toLowerCase().includes(q);
    }
    if (billSearchType === 'invoice') return (s.invoice_no||'').toLowerCase().includes(q);
    if (billSearchType === 'imei' || billSearchType === 'model' || billSearchType === 'barcode') return saleIdsFromItems.has(s.id);
    // all
    const c = DB.customers.find(x=>x.id===s.customer_id);
    return (s.invoice_no||'').toLowerCase().includes(q) || (c?.name||'').toLowerCase().includes(q) || (c?.phone||'').toLowerCase().includes(q) || saleIdsFromItems.has(s.id);
  });

  matchedSales.sort((a,b)=>b.id-a.id);

  if (!matchedSales.length) {
    results.innerHTML = `<div class="card center pad muted"><div style="font-size:40px;margin-bottom:8px">😕</div><div>No bills found for "<b>${esc(v)}</b>"</div><div class="small muted" style="margin-top:6px">Try IMEI, model, customer name, or invoice number</div></div>`;
    return;
  }

  results.innerHTML = `<div class="muted small" style="margin-bottom:10px;font-weight:600">${matchedSales.length} bill${matchedSales.length!==1?'s':''} found</div>` + matchedSales.slice(0,50).map(s => {
    const c = DB.customers.find(x=>x.id===s.customer_id);
    const u = DB.users.find(x=>x.id===s.user_id);
    const items = DB.sale_items.filter(i=>i.sale_id===s.id);
    const rt = getSaleReturnTotal(s.id);
    const itemsHTML = items.map(it => {
      const match = matchedItems.find(mi => mi.id === it.id);
      const isMatched = !!match;
      return `<div class="bill-match-item ${isMatched?'matched':''}">
        <div style="flex:1;min-width:0">${codeChip(it.item_code, it.item_type==='accessory', false, it.barcode)} <span class="strong">${esc(it.description).slice(0,80)}</span></div>
        <div style="text-align:right;flex-shrink:0"><span class="muted small">${it.qty} × ${fmtInt(it.price)}</span> <span class="strong">= ${fmtInt(it.qty * it.price)}</span></div>
      </div>`;
    }).join('');
    return `<div class="bill-match" onclick="openBillFromSearch(${s.id})">
      <div class="bill-match-head">
        <div style="flex:1;min-width:0">
          <div class="row gap" style="margin-bottom:4px;flex-wrap:wrap">
            <span class="code-chip" style="background:rgba(10,132,255,.2)">${esc(s.invoice_no)}</span>
            ${rt>0?'<span class="danger-c small">↩ returned</span>':''}
            ${s.balance>0?`<span class="warn small">⚠ bal ${fmtInt(s.balance)}</span>`:'<span class="success small">✓ paid</span>'}
          </div>
          <div class="muted small">📅 ${esc(s.created_at)} · 👤 ${esc(c?.name||'Walk-in')}${c?.phone?' · 📞 '+esc(c.phone):''}${u?' · by '+esc(u.name):''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:18px;font-weight:800">${fmtInt(s.total)}</div>
          <div class="small muted">${items.length} item${items.length!==1?'s':''}</div>
        </div>
      </div>
      <div class="bill-match-items">${itemsHTML}</div>
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap" onclick="event.stopPropagation()">
        <button class="ios-pill blue sm" onclick="printSaleReceipt(${s.id})">🖨️ Print Bill</button>
        <button class="ios-pill wa sm" onclick="promptWhatsApp(${s.id})">💬 WhatsApp</button>
        <button class="ios-pill sm" onclick="openBillFromSearch(${s.id})">👁 View</button>
      </div>
    </div>`;
  }).join('');
}
function openBillFromSearch(saleId) {
  const s = DB.sales.find(x=>x.id===saleId); if (!s) return;
  const c = DB.customers.find(x=>x.id===s.customer_id);
  const u = DB.users.find(x=>x.id===s.user_id);

function restoreFromSafety() {
  const backup = loadSafetyBackup();
  if (!isDBValid(backup)) { toast('No valid backup found','error'); return; }
  if (!confirm('Restore from safety backup? Current Firebase data will be replaced.')) return;
  DB = backup;
  migrateDB();
  saveToServer(true);
  toast('♻️ Restored from backup','success');
  setTimeout(()=>location.reload(), 800);
}
async function reloadFromServer() {
  if (!confirm('Reload from Firebase?')) return;
  const r = await loadFromServer();
  if (r.ok) { applyTheme(DB.settings.theme||'dark'); applyLogo(); render(); toast('Reloaded','success'); }
  else toast('Failed: ' + r.error, 'error');
}
function saveSettings() {
  DB.settings.shop_name = document.getElementById('s-name').value.trim() || 'PHONE HUB';

async function resetData() {

function showAddUser() {

  openModal('Add User', `<div class="form-grid">${field('Username', '<input id="nu-username" class="ios-input" autocomplete="off">', true)}${field('Display name', '<input id="nu-name" class="ios-input">', true)}${field('Password', '<input id="nu-pass" class="ios-input" type="password" autocomplete="new-password">', true)}${field('Confirm password', '<input id="nu-pass2" class="ios-input" type="password" autocomplete="new-password">', true)}${field('Role', `<select id="nu-role" class="ios-input"><option value="cashier">Cashier</option><option value="manager">Manager</option><option value="admin">Admin</option></select>`, true)}</div>`, () => {

    const pass = document.getElementById('nu-pass').value;

function uploadUserPhoto(file) {
  if (!file || !file.type.startsWith('image/') || file.size > 500 * 1024) { toast('Invalid image','error'); return; }
  const reader = new FileReader();
  reader.onload = e => { tempUserPhoto = e.target.result; const prev = document.getElementById('eu-photo-preview'); if (prev) prev.innerHTML = `<img src="${tempUserPhoto}" style="width:100%;height:100%;object-fit:cover">`; toast('Photo ready','success'); };
  reader.readAsDataURL(file);
}
function removeUserPhoto() {
  tempUserPhoto = null;
  const u = DB.users.find(x=>x.id===editingUserId);

function showChangePassword(id) {
  const u = DB.users.find(x=>x.id===id); if (!u) return;
  const isMe = u.id===currentUser.id;
  if (!isMe && !requireAdmin()) return;
  openModal(`Change password — ${u.username}`, `<div class="form-grid">${!isMe ? field('Your admin password', '<input id="cp-old-admin" class="ios-input" type="password">', true) : ''}${field('New password', '<input id="cp-new" class="ios-input" type="password">', true)}${field('Confirm', '<input id="cp-new2" class="ios-input" type="password">', true)}</div>`, () => {
    if (!isMe) { const ap = document.getElementById('cp-old-admin').value; if (hashPassword(ap) !== currentUser.password){ toast('Admin pass wrong','error'); return false; } }
    else { const op = prompt('Current password:'); if (op === null) return false; if (hashPassword(op) !== u.password){ toast('Wrong','error'); return false; } }
    const p1 = document.getElementById('cp-new').value; const p2 = document.getElementById('cp-new2').value;

function toggleUserActive(id) {
  if (!requireAdmin()) return;
  const u = DB.users.find(x=>x.id===id);
  if (!u || u.id===currentUser.id) return;

async function deleteUser(id) {
  if (!requireAdmin()) return;
  const u = DB.users.find(x=>x.id===id); if (!u) return;
  if (u.id===currentUser.id || u.username === 'admin'){ toast('Cannot delete','error'); return; }

  DB.users = DB.users.filter(x=>x.id!==id); save();
  toast('User deleted','success'); renderSettingsBody();

(async function init() {
  const cached = loadCache();
  if (isDBValid(cached)) {
    DB = cached; migrateDB();
    applyTheme(DB.settings.theme || 'dark');
    applyLogo();
    document.getElementById('login-shop-name').textContent = DB.settings.shop_name;
  }

  const r = await loadFromServer();
  if (!r.ok) {
    document.getElementById('loading-screen').innerHTML = `<div style="text-align:center;padding:20px;max-width:440px"><div style="font-size:56px;margin-bottom:16px">📡</div><h2 style="font-size:20px;margin-bottom:8px">Cannot reach Firebase</h2><p style="color:var(--text-2);font-size:13px;line-height:1.6">Check internet connection, then retry.</p><button class="ios-pill blue" style="margin-top:16px" onclick="location.reload()">🔄 Retry</button></div>`;
    return;
  }

  applyTheme(DB.settings.theme || 'dark');
  applyLogo();
  document.getElementById('login-shop-name').textContent = DB.settings.shop_name;

  const sid = Number(sessionStorage.getItem('pos_user_id'));
  if (sid) { const u = DB.users.find(x => x.id === sid && x.active); if (u) currentUser = u; }

  if (currentUser) {
    document.getElementById('loading-screen').classList.add('hidden');
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-layout').classList.remove('hidden');
    updateUserBox(); buildNav();
    currentView = firstAllowedView(); render();
  } else {
    showLogin();
  }

  fbInitDone = true;
  startRealtimeSync();
  document.getElementById('version-chip').textContent = POS_VERSION;
})();

document.getElementById('login-pass').addEventListener('keypress', e => { if (e.key==='Enter') doLogin(); });

window.addEventListener('beforeunload', () => {
  if (writeTimer) {
    clearTimeout(writeTimer);
    try { if (isDBValid(DB)) fbRef.set(DB); } catch(e) {}
  }
});
</script>
</body>
</html>
